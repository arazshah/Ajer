services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-ajer}"
      POSTGRES_USER: "${POSTGRES_USER:-ajer}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}"
    volumes:
      - ajer_postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-ajer} -d ${POSTGRES_DB:-ajer}",
        ]
      interval: 5s
      timeout: 5s
      retries: 12

  ajer:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: "${NEXT_SERVER_ACTIONS_ENCRYPTION_KEY:-}"
    restart: unless-stopped
    init: true
    ports:
      - "${AJER_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      DATABASE_URL: "postgresql://${POSTGRES_USER:-ajer}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ajer}?schema=public"
      SESSION_SECRET: "${SESSION_SECRET:?SESSION_SECRET must be set}"
      NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: "${NEXT_SERVER_ACTIONS_ENCRYPTION_KEY:-}"
      SETTINGS_ENCRYPTION_KEY: "${SETTINGS_ENCRYPTION_KEY:?SETTINGS_ENCRYPTION_KEY must be set}"
      APP_URL: "${APP_URL:?APP_URL must be set}"
      AI_API_KEY: "${AI_API_KEY:-}"
      AI_BASE_URL: "${AI_BASE_URL:-https://api.avalai.ir/v1}"
      AI_MODEL: "${AI_MODEL:-gpt-5.4-mini}"
      ZARINPAL_MERCHANT_ID: "${ZARINPAL_MERCHANT_ID:-}"
      ZARINPAL_SANDBOX: "${ZARINPAL_SANDBOX:-false}"
      SMSIR_API_KEY: "${SMSIR_API_KEY:-}"
      SMSIR_BASE_URL: "${SMSIR_BASE_URL:-https://api.sms.ir/v1}"
      SMSIR_WELCOME_TEMPLATE_ID: "${SMSIR_WELCOME_TEMPLATE_ID:-}"
      SMSIR_PAYMENT_TEMPLATE_ID: "${SMSIR_PAYMENT_TEMPLATE_ID:-}"
      SMSIR_VISIT_TEMPLATE_ID: "${SMSIR_VISIT_TEMPLATE_ID:-}"
      SMSIR_OFFER_TEMPLATE_ID: "${SMSIR_OFFER_TEMPLATE_ID:-}"
      CRON_SECRET: "${CRON_SECRET:-}"
      SUPER_ADMIN_EMAIL: "${SUPER_ADMIN_EMAIL:?SUPER_ADMIN_EMAIL must be set}"
      SUPER_ADMIN_PASSWORD: "${SUPER_ADMIN_PASSWORD:?SUPER_ADMIN_PASSWORD must be set}"
      SEED_DEMO_DATA: "${SEED_DEMO_DATA:-false}"
      UPLOAD_DIR: /app/uploads
      STORAGE_DRIVER: "${STORAGE_DRIVER:-local}"
      S3_ENDPOINT: "${S3_ENDPOINT:-}"
      S3_REGION: "${S3_REGION:-us-east-1}"
      S3_BUCKET: "${S3_BUCKET:-}"
      S3_ACCESS_KEY_ID: "${S3_ACCESS_KEY_ID:-}"
      S3_SECRET_ACCESS_KEY: "${S3_SECRET_ACCESS_KEY:-}"
      HEALTHCHECK_SECRET: "${HEALTHCHECK_SECRET:-}"
      BACKUP_MONITOR_ENABLED: "${BACKUP_MONITOR_ENABLED:-true}"
      BACKUP_MAX_AGE_HOURS: "${BACKUP_MAX_AGE_HOURS:-30}"
      BACKUP_DIR: /app/backups
    volumes:
      - ajer_uploads:/app/uploads
      - ajer_backups:/app/backups:ro
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 120s
      retries: 3

  backup:
    build:
      context: .
      dockerfile: Dockerfile.backup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: "${POSTGRES_DB:-ajer}"
      PGUSER: "${POSTGRES_USER:-ajer}"
      PGPASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}"
      BACKUP_DIR: /backups
      UPLOAD_SOURCE_DIR: /source/uploads
      BACKUP_INTERVAL_SECONDS: "${BACKUP_INTERVAL_SECONDS:-86400}"
      BACKUP_RETENTION_DAYS: "${BACKUP_RETENTION_DAYS:-14}"
    volumes:
      - ajer_uploads:/source/uploads
      - ajer_backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "test -s /backups/last-success.txt"]
      interval: 60s
      timeout: 5s
      start_period: 120s
      retries: 3

volumes:
  ajer_postgres:
  ajer_uploads:
  ajer_backups:
